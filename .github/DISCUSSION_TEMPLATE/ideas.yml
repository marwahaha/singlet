body:
  - type: markdown
    attributes:
      value: |
        Propose a research question for discussion. Tentative formulations and connections to other fields are welcome. We can discuss the formulation and whether to add it to the collection.
  - type: textarea
    id: question
    attributes:
      label: What is the question?
      description: State the question as clearly as you can.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is it interesting?
      description: What would an answer clarify or let us do?
    validations:
      required: true
  - type: textarea
    id: formulation
    attributes:
      label: Mathematical formulation or assumptions
      description: Optional. Give the systems, allowed operations, assumptions, and parameters where relevant. LaTeX is welcome.
  - type: textarea
    id: references
    attributes:
      label: Related work
      description: Optional. Include references, links, or earlier versions of this question.
  - type: input
    id: related-question
    attributes:
      label: Related questions in this collection
      description: Optional. Give a question number or title, such as Q13.
